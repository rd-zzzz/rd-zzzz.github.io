  <rect x="21.2" y="4.4" width="6.4" height="6.4" rx="1.8" fill="#f8f4ec"/>
  <rect x="4.4" y="12.8" width="6.4" height="6.4" rx="1.8" fill="#f8f4ec"/>
  <rect x="12.8" y="12.8" width="6.4" height="6.4" rx="1.8" fill="#122c1c"/>
  <rect x="21.2" y="12.8" width="6.4" height="6.4" rx="1.8" fill="#122c1c"/>
  <rect x="4.4" y="21.2" width="6.4" height="6.4" rx="1.8" fill="#122c1c"/>
  <rect x="12.8" y="21.2" width="6.4" height="6.4" rx="1.8" fill="#122c1c"/>
