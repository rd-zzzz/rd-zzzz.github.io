  (function () {
    var FONT_SIZES = [13, 14, 15, 16, 17, 18, 19, 20, 22, 24, 26, 28];
    var DEFAULT_FONT_SIZE = 16;

    var btn = document.getElementById('typoBtn');
    var pop = document.getElementById('typoPop');
    var dec = document.getElementById('fontDecrease');
    var inc = document.getElementById('fontIncrease');
    var val = document.getElementById('typoSizeVal');
    var fontBtn = document.getElementById('fontFamilyBtn');
    var fontMenu = document.getElementById('fontFamilyMenu');
    var fontLabel = document.getElementById('fontFamilyLabel');
    if (!btn || !pop) return;

    function getFontSize() {
      try {
        var stored = parseInt(localStorage.getItem('fontSize'), 10);
        return isNaN(stored) ? DEFAULT_FONT_SIZE : stored;
      } catch (e) {
        return DEFAULT_FONT_SIZE;
      }
    }

    function applyFontSize(size) {
      document.documentElement.style.fontSize = size + 'px';
      if (val) val.textContent = size;
      try { localStorage.setItem('fontSize', size); } catch (e) {}
    }

    function getFontFamily() {
      try {
        var stored = localStorage.getItem('fontFamily');
        return stored === 'serif' ? stored : 'sans';
      } catch (e) {
        return 'sans';
      }
    }

    // 同步字体按钮文案与菜单项高亮（含 aria-selected）
    function syncFontUI(valid) {
      if (fontLabel) fontLabel.textContent = valid === 'serif' ? '衬线' : '无衬线';
      if (fontMenu) {
        var items = fontMenu.querySelectorAll('.typo-font-item');
        for (var i = 0; i < items.length; i++) {
          var active = items[i].getAttribute('data-font') === valid;
          items[i].classList.toggle('active', active);
          items[i].setAttribute('aria-selected', active ? 'true' : 'false');
        }
      }
    }

    function applyFontFamily(f) {
      var valid = f === 'serif' ? 'serif' : 'sans';
      if (valid === 'sans') {
        document.documentElement.removeAttribute('data-font');
      } else {
        document.documentElement.setAttribute('data-font', valid);
      }
      syncFontUI(valid);
      try { localStorage.setItem('fontFamily', valid); } catch (e) {}
    }

    // 面板显示值与存储同步（页面加载时执行一次）
    if (val) val.textContent = getFontSize();
    syncFontUI(getFontFamily());

    // ===== 面板开合 =====
    function setOpen(open, restoreFocus) {
      pop.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        if (dec) dec.focus();
        else pop.focus();
      } else if (restoreFocus) {
        btn.focus();
      }
    }

    btn.addEventListener('click', function () {
      setOpen(!pop.classList.contains('show'));
    });

    // 点击面板外部关闭（面板与按钮都在 .typo-wrap 内，无需额外排除按钮）
    document.addEventListener('click', function (e) {
      if (!pop.classList.contains('show')) return;
      if (e.target.closest && e.target.closest('.typo-wrap')) return;
      setOpen(false, false);
    });

    // ===== 字体菜单开合 =====
    function setFontMenuOpen(open) {
      if (!fontBtn || !fontMenu) return;
      fontMenu.classList.toggle('show', open);
      fontBtn.classList.toggle('open', open);
      fontBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    if (fontBtn && fontMenu) {
      fontBtn.addEventListener('click', function () {
        setFontMenuOpen(!fontMenu.classList.contains('show'));
      });

      // 菜单项选择：应用字体、更新 UI、关闭菜单（面板保持打开，实时看效果）
      var items = fontMenu.querySelectorAll('.typo-font-item');
      for (var i = 0; i < items.length; i++) {
        items[i].addEventListener('click', function () {
          applyFontFamily(this.getAttribute('data-font'));
          setFontMenuOpen(false);
        });
      }

      // 点击字体区域外（面板内）关闭菜单；外点关闭面板由上方监听处理
      document.addEventListener('click', function (e) {
        if (!fontMenu.classList.contains('show')) return;
        if (e.target.closest && e.target.closest('.typo-font-wrap')) return;
        setFontMenuOpen(false);
      });
    }

    // Esc：优先关字体菜单，再关面板并还原焦点
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (fontMenu && fontMenu.classList.contains('show')) {
        e.preventDefault();
        setFontMenuOpen(false);
        if (fontBtn) fontBtn.focus();
      } else if (pop.classList.contains('show')) {
        e.preventDefault();
        setOpen(false, true);
      }
    });

    // 字号步进（13-28px 12 档，rem 缩放正文）
    if (dec) dec.addEventListener('click', function () {
      var cur = getFontSize();
      var idx = FONT_SIZES.indexOf(cur);
      if (idx > 0) applyFontSize(FONT_SIZES[idx - 1]);
      else if (cur > FONT_SIZES[0]) applyFontSize(cur - 1);
    });

    if (inc) inc.addEventListener('click', function () {
      var cur = getFontSize();
      var idx = FONT_SIZES.indexOf(cur);
      if (idx >= 0 && idx < FONT_SIZES.length - 1) applyFontSize(FONT_SIZES[idx + 1]);
      else if (cur < FONT_SIZES[FONT_SIZES.length - 1]) applyFontSize(cur + 1);
    });

    // 多标签页同步（与 ThemeToggle 的 storage 监听一致）
    window.addEventListener('storage', function (e) {
      if (e.key === 'fontSize') {
        var v = parseInt(e.newValue, 10);
        if (!isNaN(v)) applyFontSize(v);
      } else if (e.key === 'fontFamily') {
        applyFontFamily(e.newValue);
      }

      (function () {
        // 阅读进度条 + 回到顶部（兼容桌面 .main-content 滚动与移动端 window 滚动）
        var progress = document.getElementById('readingProgress');
        var backTop = document.getElementById('backToTop');
        if (!progress || !backTop) return;
        var main = document.querySelector('.main-content');
        var raf = 0;

        function getScroller() {
          if (main) {
            var ov = getComputedStyle(main).overflowY;
            if (ov === 'auto' || ov === 'scroll') return main;
          }
          return window;
        }

        function update() {
          raf = 0;
          var scroller = getScroller();
          var el = scroller === window ? document.documentElement : scroller;
          // is:inline 纯 JS：用 'in' 运行时收窄，规避 Window/Element 联合类型上 scrollTop 的 TS 报错
          var scrollTop = scroller === window
            ? (window.scrollY || document.documentElement.scrollTop || 0)
            : ('scrollTop' in el ? el.scrollTop : 0);
          var max = 'scrollHeight' in el ? el.scrollHeight - el.clientHeight : 0;
          var pct = max > 0 ? Math.min(1, Math.max(0, scrollTop / max)) : 0;
          // clip-path 裁剪：元素全宽渲染，只显示已读部分，避免缩放模糊
          progress.style.clipPath = 'inset(0 ' + ((1 - pct) * 100).toFixed(2) + '% 0 0)';
          var show = scrollTop > 600;
          backTop.style.opacity = show ? '1' : '0';
          backTop.style.pointerEvents = show ? 'auto' : 'none';
        }

        function onScroll() {
          if (raf) return;
          raf = requestAnimationFrame(update);
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        if (main) main.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        update();

        backTop.addEventListener('click', function () {
          var scroller = getScroller();
          if (scroller === window) window.scrollTo({ top: 0, behavior: 'smooth' });
          else scroller.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
