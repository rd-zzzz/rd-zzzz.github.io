  (function () {

    var DEFAULT_FONT_SIZE = 16;

    var btn = document.getElementById('typoBtn');

    var dec = document.getElementById('fontDecrease');

    var fontSeg = document.getElementById('fontFamilySeg');
    var boldSeg = document.getElementById('fontBoldSeg');
    if (!btn || !pop) return;

    function getFontSize() {
      try {
        var stored = parseInt(localStorage.getItem('fontSize'), 10);
        // 夹取到合法档位范围 [13,28]，与 TypoInit 的生效口径一致：
        // 脏值（如越界/损坏）时面板显示值与实际生效值保持一致

        return DEFAULT_FONT_SIZE;
      } catch (e) {
        return DEFAULT_FONT_SIZE;
      }
    }

    function applyFontSize(size) {
      // 统一夹取 [13,28]：storage 多标签页同步/脏值写入也走此函数，
      // 避免另一标签页写入越界值时本页以越界值渲染并回写。
      // 写 --read-fs 变量而非根字号：根字号会带动全站 rem（顶栏按钮/徽章等 UI
      // 一起膨胀变形），变量只有正文容器消费（见 global.css）
      size = Math.min(28, Math.max(13, size));
      document.documentElement.style.setProperty('--read-fs', size + 'px');
      if (val) val.textContent = size;
      try { localStorage.setItem('fontSize', size); } catch (e) {}
    }

    function getFontFamily() {

        var stored = localStorage.getItem('fontFamily');
        return stored === 'serif' ? stored : 'sans';
      } catch (e) {
        return 'sans';
      }
    }

    // 同步字体分段控件高亮（含 aria-checked）
    function syncFontUI(valid) {

      var items = fontSeg.querySelectorAll('.typo-seg-item');
      for (var i = 0; i < items.length; i++) {
        var active = items[i].getAttribute('data-font') === valid;
        items[i].classList.toggle('active', active);
        items[i].setAttribute('aria-checked', active ? 'true' : 'false');
      }
    }

    function applyFontFamily(f) {
      var valid = f === 'serif' ? 'serif' : 'sans';
      if (valid === 'sans') {
        document.documentElement.removeAttribute('data-font');
      } else {
        document.documentElement.setAttribute('data-font', valid);
      }
      syncFontUI(valid);

    }

      if (!boldSeg) return;
      var items = boldSeg.querySelectorAll('.typo-seg-item');
      for (var i = 0; i < items.length; i++) {
        var active = (items[i].getAttribute('data-bold') === '1') === on;

      }
    }

    function applyFontBold(on) {

        document.documentElement.setAttribute('data-font-bold', '');
      } else {
        document.documentElement.removeAttribute('data-font-bold');

      syncBoldUI(on);
      try { localStorage.setItem('fontBold', on ? '1' : '0'); } catch (e) {}

    btn.addEventListener('click', function () {

      setOpen(false, false);

    // 字体分段选择（面板保持打开，实时看效果；点已选段为幂等写入，无害）

      (function () {

        var backTop = document.getElementById('backToTop');
        if (!progress || !backTop) return;
        var main = document.querySelector('.main-content');
        var raf = 0;

        function getScroller() {

            var ov = getComputedStyle(main).overflowY;

        function update() {

          var el = scroller === window ? document.documentElement : scroller;

        if (main) main.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        update();

        backTop.addEventListener('click', function () {
          var scroller = getScroller();
          if (scroller === window) window.scrollTo({ top: 0, behavior: 'smooth' });
          else scroller.scrollTo({ top: 0, behavior: 'smooth' });
        });
